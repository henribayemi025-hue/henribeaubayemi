# Réglages lus par la CLI Supabase au déploiement des fonctions edge
# (.github/workflows/edge-functions.yml). Le reste de la configuration vit
# dans le tableau de bord Supabase; ici, seulement ce qui doit suivre le code.

project_id = "bokwivwizghdlaedczbw"

# Le serveur MCP de Legion (0174) est appelé par des assistants extérieurs
# (Claude.ai, ChatGPT…) qui n'ont ni clé Supabase ni JWT: la passerelle ne
# doit pas exiger de JWT. La fonction vérifie elle-même le jeton personnel
# (lg_…) avant de répondre quoi que ce soit.
[functions.legion-mcp]
verify_jwt = false

# Le retour de GitHub après « Se connecter avec GitHub » (28/09) : c'est le
# navigateur de la personne qui revient, sans jeton Léo. La fonction vérifie
# elle-même un « state » signé et le jeton GitHub de la personne ; ses actions
# POST exigent la session Léo.
[functions.atelier-github]
verify_jwt = false

# La formation des agents (29/09) : appelée par le serveur avec le jeton interne.
[functions.legion-former]
verify_jwt = false

# Déplacement des fichiers de Léo vers le dossier privé (01/10, audit C-2) :
# appelé par la base (pg_net) avec le jeton interne, sans JWT.
[functions.legion-vers-prive]
verify_jwt = false

# Purge du cache des photos de conversation (01/10) : appelée par la base
# avec le jeton interne, sans JWT.
[functions.chat-purger-cache]
verify_jwt = false
