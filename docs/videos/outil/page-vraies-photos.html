<!doctype html><meta charset="utf-8">
<style>
:root{--cream:#FBF3E4;--terra:#B5532F;--brass:#B8860B;--ink:#2B1D14;--line:#E6D5B8}
*{box-sizing:border-box;margin:0}
html,body{width:720px;height:1280px;overflow:hidden;background:var(--cream);font-family:Georgia,'DejaVu Serif',serif;color:var(--ink)}
.a{position:absolute}
#brand{top:52px;left:0;right:0;text-align:center;font-size:32px;letter-spacing:7px;color:var(--terra);font-weight:700}
.cap{left:40px;right:40px;text-align:center;font-weight:700;line-height:1.16}
.cap em{color:var(--terra);font-style:normal}
.card{border-radius:36px;overflow:hidden;box-shadow:0 18px 0 rgba(181,83,47,.14),0 30px 60px rgba(43,29,20,.18)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.phone{width:410px;height:840px;border:10px solid var(--ink);border-radius:60px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(43,29,20,.25)}
.phone img{width:390px;display:block}
.pill{border:5px solid var(--brass);border-radius:22px;box-shadow:0 0 0 6px rgba(184,134,11,.22)}
.tag{font-family:'DejaVu Sans',Arial,sans-serif;font-size:26px;font-weight:700;color:#fff;background:var(--terra);border-radius:999px;padding:10px 24px}
#bar{bottom:0;left:0;height:10px;background:var(--brass)}
</style>
<div id="root"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease=x=>1-Math.pow(1-clamp(x),3);
const inout=(t,a,b,f=.35)=>Math.min(ease((t-a)/f),ease((b-t)/f));
const P=n=>`file:///tmp/claude-0/video2/${n}`;
const T=20.0; const R=document.getElementById('root');
const photos=[["Un parfum","photos/caramel.webp",4.4,5.35],["Des chaussures","photos/chaussures.jpg",5.35,6.25],["Un sac en perles","photos/perles.webp",6.25,7.3],["Des ongles","photos/french.jpg",7.3,7.95],["Une coiffure","photos/jolihair.jpg",7.95,9.1]];
const mosaic=["photos/byflora.jpg","photos/savon.webp","photos/cycy.jpg","photos/baobab.jpg"];
function frame(t){
 let h=`<div class="a" id="brand">FINJARO</div>`;
 // A : mosaïque
 if(t<4.6){ const o=inout(t,-1,4.5);
  h+=`<div class="a" style="left:0;top:0;width:720px;height:1280px;opacity:${o}">`+mosaic.map((m,i)=>{const d=ease((t-.15*i)/.5);const x=60+(i%2)*312, y=170+Math.floor(i/2)*372;return `<div class="a card" style="left:${x}px;top:${y+60*(1-d)}px;width:300px;height:360px;opacity:${d};transform:rotate(${(i%2?1:-1)*(1.5-d*1.5)}deg)"><img src="${P(m)}"></div>`}).join('')
  +`<div class="a cap" style="top:950px;font-size:60px">Des vendeuses.<br><em>Leurs propres photos.</em></div></div>`; }
 // B : liste
 for(const [lab,src,a,b] of photos){ if(t>=a-.05&&t<b+.05){ const o=inout(t,a,b,.18), z=1+.10*clamp((t-a)/(b-a));
  h+=`<div class="a" style="left:0;top:0;width:720px;height:1280px;opacity:${o}"><div class="a card" style="left:36px;top:140px;width:648px;height:840px"><img src="${P(src)}" style="transform:scale(${z})"></div><div class="a cap" style="top:1030px;font-size:68px"><em>${lab}</em></div></div>`; } }
 // C : prix et monnaie
 if(t>=9.0&&t<13.0){ const o=inout(t,9.0,13.0,.3), sw=clamp((t-10.9)/.4), ring=.5+.5*Math.sin(t*9);
  h+=`<div class="a" style="left:0;top:0;width:720px;height:1280px;opacity:${o}"><div class="a phone" style="left:155px;top:120px"><div class="a" style="left:0;top:0;opacity:${1-sw}"><img src="${P('art-douala.png')}"></div><div class="a" style="left:0;top:0;opacity:${sw}"><img src="${P('art-paris.png')}"></div>
   <div class="a pill" style="left:6px;top:${446}px;width:200px;height:74px;opacity:${.6+.4*ring}"></div></div>
   <div class="a tag" style="left:${40}px;top:150px;opacity:${1-sw}">Acheteur au Cameroun</div><div class="a tag" style="left:${40}px;top:150px;opacity:${sw}">Acheteur en France</div>
   <div class="a cap" style="top:1000px;font-size:52px">${t<10.9?'Chaque article<br>a <em>son prix</em>':'Chaque acheteur<br>le voit <em>dans sa monnaie</em>'}</div></div>`; }
 // D : vendre
 if(t>=12.9&&t<16.9){ const o=inout(t,12.9,16.9,.3), z=1+.12*ease((t-13.9)/1.6);
  h+=`<div class="a" style="left:0;top:0;width:720px;height:1280px;opacity:${o}">`+(t<13.9?`<div class="a cap" style="top:500px;font-size:106px;white-space:nowrap"><em>Tu vends ?</em></div>`:
   `<div class="a phone" style="left:155px;top:110px"><div class="a" style="left:0;top:${-0}px;transform:scale(${z});transform-origin:50% 55%"><img src="${P('vendeur.png')}"></div><div class="a pill" style="left:8px;top:392px;width:374px;height:78px;opacity:${.6+.4*Math.sin(t*9)}"></div></div>
   <div class="a cap" style="top:1000px;font-size:54px">${t<15.4?'Ouvre ta boutique<br><em>en quelques écrans</em>':'Et <em>mets ton prix</em>'}</div>`)+`</div>`; }
 // E : fin
 if(t>=16.8){ const o=ease((t-16.8)/.5), b=ease((t-17.7)/.6);
  h+=`<div class="a" style="left:0;top:0;width:720px;height:1280px;opacity:${o}"><div class="a" style="left:0;right:0;top:400px;text-align:center;font-size:150px;font-weight:700;color:var(--terra);transform:scale(${.92+.08*o})">Finjaro</div><div class="a" style="left:${360-170*b}px;width:${340*b}px;top:620px;height:6px;background:var(--brass)"></div><div class="a cap" style="top:680px;font-size:62px;opacity:${b}">Au-delà des <em>rêves</em></div></div>`; }
 h+=`<div class="a" id="bar" style="width:${720*clamp(t/T)}px"></div>`;
 R.innerHTML=h;
}
window.render=(t)=>frame(t);
</script>
