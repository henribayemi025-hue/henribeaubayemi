<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1C2856"><title>Me &amp; PDD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : application mobile d'abord (barre d'onglets en bas) ; sur grand écran, colonne de navigation à gauche et contenu en colonne de lecture. Bleu nuit du soir de prière, or des médailles. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --sunk:#EDF0F7; --line:#DCE1EC;
  --ink:#141B33; --muted:#5B637F;
  --brand:#1C2856; --brand-2:#2A3A78; --on-brand:#FFFFFF; --brand-soft:#E6EAF6;
  --gold:#B8862A; --gold-ink:#8A6216; --gold-soft:#F5EBD5;
  --ok:#1F7A4D; --ok-soft:#DFF2E7; --warn:#9A5B0B; --warn-soft:#FBEBD3; --late:#B42318; --late-soft:#FDE4E1; --info:#215E9E; --info-soft:#E1ECF8;
  --bronze:#A8672F; --argent:#8D97A8; --or:#C49A1C; --platine:#5E9AAE;
  --shadow:0 1px 2px rgba(20,27,51,.05),0 8px 24px rgba(20,27,51,.06);
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-lg:20px;
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#121931; --sunk:#0F1529; --line:#25304F;
  --ink:#E8ECF8; --muted:#9AA3C2;
  --brand:#1A2550; --brand-2:#2B3B7C; --on-brand:#FFFFFF; --brand-soft:#1A2347;
  --gold:#E0B24F; --gold-ink:#EBC271; --gold-soft:#2E2715;
  --ok:#5CC48C; --ok-soft:#13301F; --warn:#E5A55A; --warn-soft:#3A2A15; --late:#F08C86; --late-soft:#3D1D1F; --info:#7FB3EA; --info-soft:#15263D;
  --bronze:#C98A55; --argent:#B3BCCB; --or:#E3BC3E; --platine:#8CC3D6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;letter-spacing:-.01em}
h2{font-size:1.4rem}
h3{font-size:1.12rem}
p{margin:0}
.num{font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}

.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--brand);color:var(--on-brand);font-size:.78rem;display:flex;gap:8px;align-items:center;justify-content:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.demo b{color:#F1D79A;font-weight:600}
.demo .dot{width:6px;height:6px;border-radius:50%;background:#F1D79A;flex:none}

.shell{display:grid;grid-template-columns:1fr;min-height:calc(100% - 30px)}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 112px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:36px;height:36px;flex:none}
.brand .t{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1;white-space:nowrap}
.brand .s{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.switch{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 0;font-weight:600;min-width:0}
.tabbar button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tabbar button[aria-current="page"]{color:var(--brand-2)}
:root[data-theme="dark"] .tabbar button[aria-current="page"]{color:var(--gold-ink)}
.tabbar svg{width:22px;height:22px}

@media (min-width:960px){
  .shell{grid-template-columns:272px 1fr}
  .side{display:flex;flex-direction:column;gap:20px;position:sticky;top:30px;height:calc(100vh - 30px);overflow:auto;padding:24px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .main{padding-block:28px 60px;padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}
  .tabbar,.topbar{display:none}
  h1{font-size:2.5rem}
}
.side nav{display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 10px 6px;font-weight:700}
.navlink{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;color:var(--ink);font-weight:500;width:100%}
.navlink svg{width:19px;height:19px;color:var(--muted);flex:none}
.navlink:hover{background:var(--sunk)}
.navlink[aria-current="page"]{background:var(--brand-soft)}
.navlink[aria-current="page"] svg{color:var(--brand-2)}
.navlink .badge{margin-left:auto}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:.8rem;color:var(--muted)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.hero{background:var(--brand);color:var(--on-brand);border-radius:var(--r-lg);padding:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(241,215,154,.28),transparent 70%);pointer-events:none}
.hero .eyebrow{color:#F1D79A}
.hero .muted{color:rgba(255,255,255,.74)}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack-s{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{color:var(--brand-2);font-weight:700;font-size:.88rem;background:none;border:0;padding:0}
:root[data-theme="dark"] .link{color:var(--gold-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;padding:11px 16px;font-weight:700;font-size:.95rem;min-height:44px}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
:root[data-theme="dark"] .btn-primary{background:var(--gold);color:#16120A}
.btn-gold{background:#F1D79A;color:#1C2856}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--sunk)}
.btn-block{width:100%}
.btn-s{min-height:36px;padding:6px 12px;font-size:.84rem;border-radius:10px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-late{background:var(--late-soft);color:var(--late)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--sunk);color:var(--muted)}
.p-gold{background:var(--gold-soft);color:var(--gold-ink)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--brand-2)}
:root[data-theme="dark"] .li .ic{color:var(--gold-ink)}
.li .ic svg{width:19px;height:19px}
.li .body{flex:1;min-width:0}
.li .body .t{font-weight:600;overflow-wrap:anywhere}
.li .body .s{font-size:.82rem;color:var(--muted)}
.li .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
button.li{width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
button.li:hover{background:var(--sunk)}

.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog>span{display:block;height:100%;background:var(--brand-2);border-radius:99px}
:root[data-theme="dark"] .prog>span{background:var(--gold)}
.prog.ok>span{background:var(--ok)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.84rem;font-weight:700}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.hint{font-size:.8rem;color:var(--muted)}

.choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.choice[aria-checked="true"]{border-color:var(--gold);background:var(--gold-soft)}
.choice .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.choice[aria-checked="true"] .radio{border-color:var(--gold)}
.choice[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.choice .body{flex:1;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}

.toggle{width:46px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{left:21px}

.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-weight:700;padding:4px 0;font-size:.9rem;align-self:flex-start}
.back svg{width:18px;height:18px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:.86rem;color:var(--muted)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--gold-ink)}

/* Fiche de prière */
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.fiche-h{background:var(--gold-soft);padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fiche-b{padding:6px 18px 16px;display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){.fiche-b{grid-template-columns:1fr 1fr}}
.reading{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--line)}
.reading:first-of-type{border-top:0}
.reading .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;width:86px;flex:none}
.reading .v{font-family:var(--f-display);font-size:1.08rem;font-weight:600}
.ex{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 0;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0}
.ex .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.ex[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.ex[aria-checked="true"] .lbl2{text-decoration:line-through;color:var(--muted)}
.ex .box svg{width:14px;height:14px}

/* Médailles */
.medals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.medals{grid-template-columns:repeat(4,1fr)}}
.medal{border:1.5px solid var(--line);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface);min-width:0}
.medal .disc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:1rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.medal.got{border-color:var(--ok)}
.medal.next{border-color:var(--gold);background:var(--gold-soft)}
.medal .v{font-weight:700;font-variant-numeric:tabular-nums}
.medal .x{font-size:.75rem;color:var(--muted)}

.stat{display:flex;flex-direction:column;gap:2px;padding:14px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .k{font-size:.8rem;color:var(--muted)}
.bus{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.seats{display:flex;gap:3px;flex-wrap:wrap}
.seats i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.seats i.t{background:var(--brand-2)}
:root[data-theme="dark"] .seats i.t{background:var(--gold)}

.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
table.t thead th{border-top:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* Onboarding */
.onb{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:8px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--gold)}

/* Feuille */
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:22px}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.paybtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-weight:700;min-height:54px;text-align:left}
.paybtn:hover{border-color:var(--gold)}
.paybtn .sub{font-weight:500;font-size:.78rem;color:var(--muted)}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spin .8s linear infinite;align-self:center}
.success{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;align-self:center}
.success svg{width:32px;height:32px}
.receipt{border:1px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.receipt .row{justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:11px 16px;border-radius:12px;z-index:80;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast svg{width:18px;height:18px;color:#F1D79A;flex:none}
@media (min-width:960px){.toast{bottom:28px}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

/* ---------- Paiement (simulation) ---------- */
let PAY=null;
function openPay(o){ PAY={...o,step:'choose'}; renderLayer(); }
function renderLayer(){
 const el=document.getElementById('layer');
 let h='';
 if(PAY){
  const head=`<div class="grab"></div><div class="row between"><h2>${PAY.step==='done'?(S.lang==='en'?'Thank you':'Merci'):(S.lang==='en'?'Payment':'Paiement')}</h2><button class="back" data-close aria-label="Fermer">${ic('x')}</button></div>`;
  if(PAY.step==='choose') h=`${head}
   <div class="receipt"><div class="row"><span class="muted">${esc(PAY.label)}</span><b class="num">${money(PAY.amt)}</b></div></div>
   ${PAY.fundChoice?`<div class="chips">${[{fr:'Centre de retraite',en:'Retreat centre'},{fr:'Fonds de solidarité',en:'Solidarity fund'},{fr:'Mon groupe',en:'My group'}].map((f,i)=>`<button class="chip" aria-pressed="${(PAY.fund||0)===i}" data-fund="${i}">${esc(L(f))}</button>`).join('')}</div>`:''}
   <div class="stack-s">${C().pay.map(m=>`<button class="paybtn" data-method="${esc(m)}"><span>${esc(m)}<span class="sub" style="display:block">${S.lang==='en'?'Simulation':'Simulation'}</span></span>${ic('chev')}</button>`).join('')}</div>
   <p class="hint">${t('sim')}</p>`;
  if(PAY.step==='wait') h=`${head}<div class="spinner"></div><p class="muted" style="text-align:center">${S.lang==='en'?'Confirming…':'Confirmation…'}</p>`;
  if(PAY.step==='done') h=`${head}<div class="success">${ic('check')}</div>
   <div class="receipt"><div class="row"><span class="muted">${S.lang==='en'?'Receipt':'Reçu'}</span><b>${PAY.id}</b></div><div class="row"><span class="muted">${esc(PAY.label)}</span><b class="num">${money(PAY.amt)}</b></div><div class="row"><span class="muted">${S.lang==='en'?'Method':'Moyen'}</span><span>${esc(PAY.method)}</span></div></div>
   <p class="muted small">${S.lang==='en'?'The receipt is in History and sent by e-mail.':'Le reçu est dans l\'historique et envoyé par e-mail.'}</p>
   <button class="btn btn-primary btn-block" data-close>${S.lang==='en'?'Done':'Terminé'}</button>`;
  h=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
 }
 if(RECEIPT){ const r=S.history.find(x=>x.id===RECEIPT);
  h+=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="row between"><h2>${S.lang==='en'?'Receipt':'Reçu'} ${esc(r.id)}</h2><button class="back" data-close aria-label="Fermer">${ic('x')}</button></div>
  <div class="receipt"><div class="row"><span class="muted">${S.lang==='en'?'Association':'Association'}</span><b>Parole de Dieu</b></div><div class="row"><span class="muted">${S.lang==='en'?'Member':'Membre'}</span><span>Grâce N. · ${esc(S.group)}</span></div><div class="row"><span class="muted">${S.lang==='en'?'For':'Objet'}</span><span style="text-align:right">${esc(L(r.title))}</span></div><div class="row"><span class="muted">Date</span><span>${new Date(r.date+'T12:00').toLocaleDateString(LOC())}</span></div><div class="row"><span class="muted">${S.lang==='en'?'Method':'Moyen'}</span><span>${esc(r.method)}</span></div><div class="row" style="border-top:1px solid var(--line);padding-top:8px"><b>${S.lang==='en'?'Amount':'Montant'}</b><b class="num">${money(r.amt)}</b></div></div>
  <button class="btn btn-ghost btn-block" data-toast="${S.lang==='en'?'In the real app, the PDF receipt is sent by e-mail.':'Dans la vraie appli, le reçu PDF part par e-mail.'}">${ic('doc')}${S.lang==='en'?'Receive the PDF by e-mail':'Recevoir le PDF par e-mail'}</button></div></div>`;}
 if(S.toast) h+=`<div class="toast" role="status">${ic('check')}<span>${esc(S.toast)}</span></div>`;
 el.innerHTML=h;
}
let RECEIPT=null;
function toast(m){ S.toast=m; renderLayer(); clearTimeout(toast._t); toast._t=setTimeout(()=>{S.toast=null;renderLayer();},2600); }

/* ---------- Rendu ---------- */
function render(){
 document.documentElement.lang=S.lang;
 shell();
 const v=document.getElementById('view');
 if(!S.onboarded){ document.querySelector('.side').style.visibility='hidden'; v.innerHTML=V.onboarding(); return; }
 document.querySelector('.side').style.visibility='';
 v.innerHTML=(V[S.screen]||V.actus)();
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('button'); if(!b) { if(e.target.matches('[data-scrim]')){PAY=null;RECEIPT=null;renderLayer();} return; }
 const d=b.dataset;
 if('themeToggle' in d){ document.documentElement.dataset.theme=isDark()?'light':'dark'; render(); return; }
 if(d.lang){ S.lang=d.lang; seedHistory(); render(); return; }
 if(d.country){ S.country=d.country; S.region=C().regions[0].id; S.group=C().regions[0].groups[0]; seedHistory(); render(); return; }
 if(d.region){ S.region=d.region; S.group=C().regions.find(r=>r.id===d.region).groups[0]; render(); return; }
 if(d.group){ S.group=d.group; render(); return; }
 if(d.onb){ const s=S.onbStep+Number(d.onb); if(s<0) return; if(s>2){ S.onboarded=true; S.screen='actus'; S.stack=[]; seedHistory(); try{localStorage.setItem('mepdd',JSON.stringify({c:S.country,r:S.region,g:S.group,l:S.lang}));}catch(_){} } else S.onbStep=s; render(); window.scrollTo({top:0}); return; }
 if('reonb' in d){ S.onboarded=false; S.onbStep=0; render(); return; }
 if(d.space){ S.space=d.space; S.stack=[]; S.screen=d.space==='membre'?'actus':'r-publier'; render(); window.scrollTo({top:0}); return; }
 if(d.go){ go(d.go,d.param); return; }
 if('back' in d){ back(); return; }
 if(d.ex!=null){ S.exDone[d.ex]=!S.exDone[d.ex]; render(); return; }
 if(d.attend){ S.attending[d.attend]=!S.attending[d.attend]; render(); if(S.attending[d.attend]) toast(S.lang==='en'?'Your leader knows you are coming.':'Ton responsable sait que tu viens.'); return; }
 if(d.room){ if(b.getAttribute('aria-disabled')==='true') return; S.retreatSel.room=d.room; render(); return; }
 if(d.plan){ S.retreatSel.plan=d.plan; render(); return; }
 if(d.bus){ S.retreatSel.bus=S.retreatSel.bus===d.bus?null:d.bus; render(); return; }
 if(d.car){ S.retreatSel.car=S.retreatSel.car===d.car?null:d.car; render(); if(S.retreatSel.car) toast(S.lang==='en'?'Request sent to the driver.':'Demande envoyée au conducteur.'); return; }
 if('offerCar' in d){ toast(S.lang==='en'?'In the real app: departure, time, seats.':'Dans la vraie appli : départ, heure, places.'); return; }
 if(d.solid!=null){ S.retreatSel.solid=Number(d.solid); render(); return; }
 if(d.statut){ S.me.statut=d.statut; render(); return; }
 if(d.rem){ S.reminders[d.rem]=!S.reminders[d.rem]; render(); return; }
 if(d.virAmt){ document.querySelectorAll('[data-vir-amt]').forEach(x=>x.setAttribute('aria-pressed',x===b)); return; }
 if('virStart' in d){ const a=document.querySelector('[data-vir-amt][aria-pressed="true"]'); S.virement={amt:Number(a?a.dataset.virAmt:PR().virement[1]),day:document.getElementById('vir-day').value,fund:document.getElementById('vir-fund').value}; render(); toast(S.lang==='en'?'Standing order set up (simulation).':'Virement permanent mis en place (simulation).'); return; }
 if('virStop' in d){ S.virement=null; render(); return; }
 if('payMonthly' in d){ openPay({label:L({fr:'Contribution mensuelle · novembre',en:'Monthly contribution · November'}),amt:PR().cotisation,kind:'cotisation'}); return; }
 if(d.payRetreat){ const r=RETREATS().find(x=>x.id===d.payRetreat); openPay({label:L(r.name),amt:Number(d.amt),kind:'retraite',retreat:r.id}); return; }
 if(d.payDon){ openPay({label:L({fr:'Don',en:'Gift'}),amt:Number(d.amt||PR().don[2]),kind:'don',fundChoice:d.payDon==='libre',fund:d.payDon==='centre'?0:0}); return; }
 if(d.fund!=null&&PAY){ PAY.fund=Number(d.fund); renderLayer(); return; }
 if(d.method&&PAY){ PAY.method=d.method; PAY.step='wait'; renderLayer(); setTimeout(()=>{ PAY.step='done'; PAY.id='PDD-'+(1000+S.history.length+Math.floor(Math.random()*9000));
   S.history.unshift({id:PAY.id,date:'2026-11-09',kind:PAY.kind,title:{fr:PAY.label,en:PAY.label},amt:PAY.amt,method:PAY.method});
   if(PAY.kind==='cotisation') S.monthly.paid=true;
   if(PAY.kind==='retraite') S.myRegs[PAY.retreat]=true;
   if(PAY.kind==='don'&&(PAY.fund||0)===0) S.paidCentreXAF+=CUR()==='XAF'?PAY.amt:Math.round(PAY.amt*XAF_PER_EUR);
   renderLayer(); render(); },1100); return; }
