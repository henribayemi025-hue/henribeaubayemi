# Cloudflare Workers static-assets config for the Finjaro SPA.
# `npx wrangler deploy` (the project's deploy command) uploads ./dist and
# serves it as a single-page app: unknown routes fall back to index.html so
# client-side routing works and deep links don't return a white screen.
name = "finjaro"
compatibility_date = "2026-07-23"
# Le Worker sert d'abord la route /img/* (proxy cache devant Supabase Storage —
# voir src/worker.js pour le pourquoi). Tout le reste passe par le binding
# ASSETS et reste servi tel quel depuis ./dist.
main = "src/worker.js"

# L'IA gratuite de Cloudflare (Workers AI) pour Léo et Finia, servie sur
# /ia/chat/completions (src/ia.js). Le plafond du jour est tenu par la base
# (ia_gratuite_reserver, migration 0231) : le compte est sur l'offre payante
# Workers, Cloudflare facturerait au-delà de sa part gratuite.
[ai]
binding = "AI"

# Empreinte SHA-256 du jeton « ia_gratuite » (coffre de Supabase). Publique
# sans risque : elle ne permet pas de retrouver le jeton.
[vars]
IA_JETON_SHA256 = "ede16ea3f92fc3baf752f76a573ebb46720516389a502475c893157d34f06da8"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Learn (public/learn) reste réservé à la préproduction tant que Beau ne l'a
# pas décidé (01/10 : « laisse Learn sur staging, on ne se presse pas »). Ses
# fichiers passent donc d'abord par le Worker, qui les refuse sur finjaro.net
# (voir learnFerme dans src/worker.js). /csp-rapport reçoit les rapports de la
# CSP en mode rapport (M-1).
# 13/10 : /img/* et /sitemap.xml ajoutés. Sans eux, Cloudflare répond la page
# d'accueil (HTML, code 200) à la place du Worker : toutes les photos d'articles
# (servies par /img/{bucket}/{chemin}) s'affichaient comme une icône grise, et
# le plan du site renvoyait du HTML. Constaté le 13/10 sur finjaro.net ET sur
# staging ; la même requête sur /geo (déjà listé ci-dessus) répondait bien.
run_worker_first = ["/learn", "/learn/*", "/csp-rapport", "/geo", "/ia/*", "/img/*", "/sitemap.xml"]

# --- Test/staging -----------------------------------------------------------
# PAS un environnement wrangler séparé — testé et abandonné (`--env staging`
# ignoré par `wrangler deploy`, qui promeut TOUJOURS en production quel que
# soit --env). Le vrai mécanisme Cloudflare pour un aperçu isolé: sur
# Settings > Build, la commande "Non-production branch deploy command" doit
# être `npx wrangler versions upload` — elle crée une version à part, jamais
# promue, avec une adresse d'aperçu stable générée depuis le nom de branche
# (confirmé: la branche `staging` donne staging-finjaro.finjaro.workers.dev).
# La commande "Deploy command" (branche de production) reste `npx wrangler
# deploy` tout court.
