# Cloudflare Workers static-assets config for the Finjaro SPA.
# `npx wrangler deploy` (the project's deploy command) uploads ./dist and
# serves it as a single-page app: unknown routes fall back to index.html so
# client-side routing works and deep links don't return a white screen.
name = "finjaro"
compatibility_date = "2026-07-23"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# --- Test/staging -----------------------------------------------------------
# Worker SÉPARÉ, avec sa propre URL (finjaro-staging.<compte>.workers.dev) —
# jamais le même que finjaro.net. Déployé avec
# `npx wrangler deploy --env staging`. Il FAUT que ce soit la commande
# configurée côté Cloudflare pour les branches non-production (Settings >
# Build > "Non-production branch deploy command") — sinon Cloudflare republie
# tout droit sur finjaro.net avec la commande de prod, quelle que soit la
# branche poussée.
[env.staging]
name = "finjaro-staging"

[env.staging.assets]
directory = "./dist"
not_found_handling = "single-page-application"
