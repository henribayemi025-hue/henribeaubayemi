<script>
// Finjaro — le reel « monteur » : salut, chapitres par rayon, la multitude,
// et la collection Finou Winter en finale.
//
// Beau: « mets-toi dans la peau d'un monteur top… salut je vous présente nos
// top boutiques… montre toute cette multitude… à la fin la collection Finou
// Winter ». Structure: intro parlante -> 7 chapitres (mode femme, mode homme,
// beauté, enfants, high-tech, quotidien, pro) -> ce que l'app sait faire ->
// carte Finou Winter. Coupes a 1,25 s, mouvements alternes (zoom avant,
// zoom arriere, panoramique gauche/droite) pour que rien ne soit statique.
//
// AUCUN CHIFFRE INVENTE: chaque article et chaque prix vient de la base, dans
// la monnaie du pays de la boutique. Les articles au nom muet (« Baby 12 »)
// passent en photo seule. Aucune photo prise sur le web.
const BASE = 'http://127.0.0.1:4790/';
const W = 1080, H = 1920;
const CREME='#FAF6F0', CREME2='#F1E8DC', ENCRE='#241C17', TERRA='#C25E38',
      LAITON='#8C6A3D', TEAL='#2F6D62', VERTF='#1F3D36';

const T_INTRO=4.0, T_CH=1.45, T_PH=1.1, T_FEAT=4.2, T_FIN=6.4;

// Le montage. p = photo (b boutique, v ville, a article, i image, prix texte
// deja resolu — la monnaie de la boutique, calculee ICI et pas a l'ecran).
const F = (n) => n.toLocaleString('fr-FR') + ' FCFA';
const E = (n) => Math.round(n/655.957) + ' €';
const SEQ = [
 {chap:'01', titre:'La mode femme', items:[
  {b:'SM Store & Beauty', v:'Yaoundé', a:'Robe maya', prix:F(7000), i:'720c4d78-c78d-49cd-9318-6daf72e7f865/9251938c-a962-437c-ab1a-e55a8333da53.jpg'},
  {b:'SM Store & Beauty', v:'Yaoundé', a:'Robe', prix:F(7000), i:'720c4d78-c78d-49cd-9318-6daf72e7f865/9ac45e4b-0396-422e-a50d-03dae3cbb868.jpg'},
  {b:'SM Store & Beauty', v:'Yaoundé', a:'Ensemble', prix:F(9500), i:'720c4d78-c78d-49cd-9318-6daf72e7f865/2d3ab17e-e985-4c76-a100-8bb23de871fe.jpg'},
  {b:'SM Store & Beauty', v:'Yaoundé', a:'Robe', prix:F(7000), i:'720c4d78-c78d-49cd-9318-6daf72e7f865/f64c4c0e-4a24-4515-b2f4-3ea2668f0ace.jpg'},
  {b:'TANA Shop', v:'Douala', a:'Robe noire dentelle', prix:F(2500), i:'ec5f1982-015e-4c22-9748-e2c4709a32ad/b7cb91fb-10aa-4d8f-8873-90ba8667a488.jpg'},
  {b:'Maison NGC', v:'Yaoundé', a:'Boubou', prix:'Prix sur demande', dem:true, i:'373f6a65-d417-4a84-b899-bd16b52de908/b3edac74-471e-4822-9415-cbb6bacc9399.jpg'}],
  duo:[{b:'TANA Shop', v:'Douala', a:'Robe rose fleurie', prix:F(1500), i:'ec5f1982-015e-4c22-9748-e2c4709a32ad/3b244ffc-10c7-4518-8143-3f48e460bcb3.jpg'},
       {b:'TANA Shop', v:'Douala', a:'Robe longue manche', prix:F(2500), i:'ec5f1982-015e-4c22-9748-e2c4709a32ad/0d61cd53-32af-42bc-8f95-a41ebdea63cc.jpg'}]},
 {chap:'02', titre:'La mode homme', items:[
  {b:'MTGBA Market Place', v:'Yaoundé', a:'Mocassins noirs vernis', prix:'Prix sur demande', dem:true, i:'49d28698-1f14-4b4e-9276-62d1ca26c03e/68e21072-1f5e-4809-912c-857fac348c68.webp'},
  {b:'MTGBA Market Place', v:'Yaoundé', a:'Chaussures chukka en daim', prix:'Prix sur demande', dem:true, i:'49d28698-1f14-4b4e-9276-62d1ca26c03e/9fab68ed-87eb-4866-9767-03f2a8d34917.webp'},
  {b:'MTGBA Market Place', v:'Yaoundé', a:'Ensemble short et polo bordeaux', prix:'Prix sur demande', dem:true, i:'49d28698-1f14-4b4e-9276-62d1ca26c03e/39f4d24e-166d-4e8c-8c03-ba999a7e20e9.webp'}],
  duo:[{b:'MTGBA Market Place', v:'Yaoundé', a:'Chaussures en daim bleu marine', prix:'Prix sur demande', dem:true, i:'49d28698-1f14-4b4e-9276-62d1ca26c03e/e36463bc-d523-46f9-bbf9-4fc32470f311.webp'},
       {b:'MTGBA Market Place', v:'Yaoundé', a:'Mocassins BOSS noir brillant', prix:'Prix sur demande', dem:true, i:'49d28698-1f14-4b4e-9276-62d1ca26c03e/64259614-180a-42a6-b129-c266925c9117.webp'}]},
 {chap:'03', titre:'La beauté', items:[
  {b:'Nnal Beauty', v:'Yaoundé', a:'Zikel : fond de teint compact', prix:F(7000), i:'ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/f10f208d-84a7-4714-8395-e6a1610ce14d.jpg'},
  {b:'Didi_beauty56', v:'Nanterre', a:'French blanche', prix:E(19685), i:'86d2bee7-e378-4efd-84d7-6a9c39c66ca8/b769ef9a-7b74-4ea5-8981-5a75dd378ca9.jpg'},
  {b:'Nnal Beauty', v:'Yaoundé', a:'Kit de pinceaux', prix:F(7500), i:'ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/66448e00-33ad-46e7-b7c0-2f385d10e239.jpg'}],
  duo:[{b:'Nnal Beauty', v:'Yaoundé', a:'Fix makeup : fixateur', prix:F(3000), i:'ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/9fa43c2a-adc0-4e14-a1e7-83a712bc1299.jpg'},
       {b:'Didi_beauty56', v:'Nanterre', a:'French Bordeaux', prix:'Prix sur demande', dem:true, i:'86d2bee7-e378-4efd-84d7-6a9c39c66ca8/26f4871a-70f9-4577-bf05-d83a85328bd5.jpg'}]},
 {chap:'04', titre:'Les enfants & bébé', items:[
  {b:'ByFlora kids', v:'Douala', i:'dbd3f4a3-6a6a-496e-862b-fee7e22946e4/2b8b843b-af68-4ddb-a24b-4e9c53c8fd13.jpg'},
  {b:'Meksbabyshop', v:'Toronto', a:'Ensembles jogging fille et garçon', prix:'Prix sur demande', dem:true, i:'f5338549-363d-4719-a785-a2b72227e170/1253c449-be80-4e71-9ed5-4dc7c92cf88a.webp'},
  {b:'MTGBA Market Place', v:'Yaoundé', a:'Sac à dos licorne', prix:'Prix sur demande', dem:true, i:'49d28698-1f14-4b4e-9276-62d1ca26c03e/48d9f44e-8be2-4bf8-871a-bdb4214f144a.webp'}],
  duo:[{b:'ByFlora kids', v:'Douala', a:'Tenue bébé', prix:'Prix sur demande', dem:true, i:'dbd3f4a3-6a6a-496e-862b-fee7e22946e4/40181c82-544b-466c-b18b-d43fb2fece86.jpg'},
       {b:'ByFlora kids', v:'Douala', a:'Tenue bébé', prix:'Prix sur demande', dem:true, i:'dbd3f4a3-6a6a-496e-862b-fee7e22946e4/9890876f-05e2-4750-b071-04f9f232750a.jpg'}]},
 {chap:'05', titre:'Le high-tech', items:[
  {b:'Mr Solution', v:'Yaoundé', a:'Samsung Galaxy S22+ 256 Go', prix:F(180000), i:'2630236e-418f-4c06-a808-530743d5795f/27ad0356-7d06-4fca-a9a3-bd97c000d6db.webp'},
  {b:'Mr Solution', v:'Yaoundé', a:'Samsung Galaxy', prix:'Prix sur demande', dem:true, i:'2630236e-418f-4c06-a808-530743d5795f/27079c9d-e77e-4179-be2f-9b292e080db9.webp'}]},
 {chap:'06', titre:'Le quotidien', items:[
  {b:'YAKA BAOBAB', v:'Yaoundé', a:'Jus naturel de baobab', prix:F(1000), i:'7be8b524-9c39-4fe2-b804-b71eadf92b88/44e2f5ad-b8bd-45c8-8aee-446f7f22bcc8.jpg'},
  {b:'Crousty chips', v:'Douala', a:'Crousty chips', prix:'Prix sur demande', dem:true, i:'0f52784e-7cb1-4455-b4d3-03e1133c9d9a/3ab3e631-f477-4cc9-9e11-86e590058d15.webp'},
  {b:'Yak store', v:'Yaoundé', a:'Sacs et chaussures enfants', prix:F(6000), i:'9ccbf156-1079-42c6-8e0b-53ad9f3af301/fd055de5-b601-46ff-a45d-54ef9f09047d.jpg'}],
  duo:[{b:'MTGBA Market Place', v:'Yaoundé', a:"Bouteilles d'eau colorées", prix:'Prix sur demande', dem:true, i:'49d28698-1f14-4b4e-9276-62d1ca26c03e/f39c80bf-0707-4f54-b309-ca8eea8c5e09.webp'},
       {b:'YAKA BAOBAB', v:'Yaoundé', a:'Jus naturel de baobab', prix:F(1000), i:'7be8b524-9c39-4fe2-b804-b71eadf92b88/11787056-5931-4fbd-a303-f6dcaeabca5e.jpg'}]},
 {chap:'07', titre:"L'équipement pro", items:[
  {b:'Lmp sarl', v:'Douala Akwa', a:'Bottes Red Wing', prix:F(150000), i:'6c856c40-152f-457a-83cd-a125aa47f3f6/5804fa0f-ec56-4a23-802b-d6234fad8f61.jpg'},
  {b:'Lmp sarl', v:'Douala Akwa', a:'Gilet de signalisation', prix:F(5000), i:'6c856c40-152f-457a-83cd-a125aa47f3f6/bb196a58-1c81-4b6c-9967-a095051bab49.jpg'}]},
];

// Les Fin: images extraites des VRAIES videos publiees sur Finjaro.
const REELS = [
 {b:'ECLAT D\'ÉBÈNE', v:'Douala', t:'Savon noir', i:'reel-eclat-1.jpg'},
 {b:'Hegshair', v:'Stuttgart', t:'Mèches pour tissage', i:'reel-hegs-2.jpg'},
 {b:'ECLAT D\'ÉBÈNE', v:'Douala', t:'Savon noir', i:'reel-eclat-3.jpg'},
 {b:'Hegshair', v:'Stuttgart', t:'Mèches pour tissage', i:'reel-hegs-5.jpg'},
];
// Les services reellement inscrits, avec leur metier declare.
const SERVICES = [
 ['THOT ELECTRICAL','Électricité & plomberie','Yaoundé & Douala'],
 ['TidalEx','Informatique & digital','Douala'],
 ['Crea Lab','Marketing & communication','Yaoundé'],
 ['Music live','Prestataire événementiel','Louveciennes'],
 ['Teug\'s','Beauté à domicile','Yaoundé'],
 ['Mr Solution','Transport, cours, photo','Yaoundé'],
];

// ---------- timeline ----------
const plans = [{ type:'intro', d:T_INTRO }];
let k = 0;
// 1. Les Fin — les videos des boutiques.
plans.push({ type:'titre', d:1.6, sur:'Les Fin', sous:'Les vidéos des boutiques' });
// Ici viennent les VRAIES videos: ce montage s'arrete, ffmpeg intercale les
// extraits, puis reprend. Beau: « ca n'a pas fait defiler les videos, c'est
// juste des images statiques ». Il avait raison — une image extraite d'une
// video reste une image.
const T_FIN_VIDEO = 0;   // duree geree hors canvas
plans.push({ type:'coupure', d:0.001 });
// 2. Les services.
plans.push({ type:'titre', d:1.7, sur:'Les services', sous:'Pas que des articles' });
plans.push({ type:'services', d:5.2 });
// 3. Les boutiques, rayon par rayon.
plans.push({ type:'titre', d:1.7, sur:'Les boutiques', sous:'Rayon par rayon' });
for (const c of SEQ) {
  plans.push({ type:'chap', d:T_CH, c });
  for (const it of c.items) plans.push({ type:'photo', d:T_PH, it, mv:k++ % 4 });
  if (c.duo) plans.push({ type:'duo', d:1.9, a1:c.duo[0], a2:c.duo[1] });
}
// 4. Finia.
plans.push({ type:'finia', d:5.0 });
// 5. L'appel a l'action, puis la carte de collection.
plans.push({ type:'cta', d:4.0 });
plans.push({ type:'fin', d:T_FIN });
const TOTAL = plans.reduce((t,p)=>t+p.d,0);
const bornes=[]; { let a=0; for (const p of plans){ bornes.push([a,a+p.d,p]); a+=p.d; } }
function planA(t){ for(const [a,b,p] of bornes) if(t>=a&&t<b) return [p,(t-a)/p.d]; return [plans[plans.length-1],1]; }

// ---------- dessin ----------
const cv=document.getElementById('c'), g=cv.getContext('2d');
const cache=new Map();
const lisse=(x)=>x<0?0:x>1?1:x*x*(3-2*x);

function fond(){ const gr=g.createLinearGradient(0,0,W*.4,H);
  gr.addColorStop(0,CREME); gr.addColorStop(1,CREME2); g.fillStyle=gr; g.fillRect(0,0,W,H); }

function couvre(im, mv, u){
  const base=Math.max(W/im.width, H/im.height);
  let z=1.12, dx=0, dy=0;
  if(mv===0) z=1.04+.10*u;
  else if(mv===1) z=1.14-.10*u;
  else if(mv===2){ dx=(u-.5)*W*.055; }
  else { dx=(.5-u)*W*.055; }
  const r=base*z, w=im.width*r, h=im.height*r;
  g.drawImage(im,(W-w)/2+dx,(H-h)/2+dy,w,h);
}
function lignes(txt,police,maxL){ g.font=police; const out=[]; let cur='';
  for(const m of String(txt).split(' ')){ const e=cur?cur+' '+m:m;
    if(g.measureText(e).width>maxL&&cur){out.push(cur);cur=m;}else cur=e; }
  if(cur)out.push(cur); return out; }

function dessine(p,u){
  const e=lisse(u/.24);
  if(p.type==='intro'){
    fond();
    // deux temps: « Salut 👋 » puis la promesse.
    const a=Math.min(1,u/.32), b=lisse((u-.34)/.28);
    g.textAlign='center';
    g.globalAlpha=a;
    g.font='900 150px Fraunces, Georgia, serif'; g.fillStyle=ENCRE;
    g.fillText('Salut 👋', W/2, 760 - (1-a)*40);
    g.globalAlpha=b;
    g.font='600 62px Fraunces, Georgia, serif'; g.fillStyle=LAITON;
    g.fillText('On vous présente', W/2, 950 + (1-b)*40);
    g.font='900 96px Fraunces, Georgia, serif'; g.fillStyle=ENCRE;
    g.fillText('les top boutiques', W/2, 1080 + (1-b)*40);
    g.fillStyle=TERRA; g.fillText('Finjaro', W/2, 1200 + (1-b)*40);
    g.globalAlpha=b; g.fillStyle=TERRA;
    g.beginPath(); g.roundRect(W/2-90, 1268+(1-b)*40, 180, 8, 8); g.fill();
    g.globalAlpha=1; return;
  }
  if(p.type==='chap'){
    fond();
    // grand numero en filigrane derriere le titre — la signature du chapitre.
    g.globalAlpha=.13*e; g.font='900 640px Fraunces, Georgia, serif';
    g.fillStyle=TERRA; g.textAlign='center'; g.fillText(p.c.chap, W/2, 1160);
    g.globalAlpha=e;
    const zoomT=1+.03*(1-e);
    g.save(); g.translate(W/2,960); g.scale(zoomT,zoomT);
    g.font='800 34px Inter, sans-serif'; g.fillStyle=LAITON;
    g.fillText('CHAPITRE '+p.c.chap, 0, -110);
    const ls=lignes(p.c.titre,'900 118px Fraunces, Georgia, serif',940);
    g.fillStyle=ENCRE;
    ls.forEach((l,i)=>g.fillText(l,0,20+i*126));
    g.fillStyle=TERRA; g.beginPath(); g.roundRect(-80, 90+(ls.length-1)*126, 160, 8, 8); g.fill();
    g.restore(); g.globalAlpha=1; return;
  }
  if(p.type==='feat'){
    fond();
    g.globalAlpha=lisse(u/.2); g.textAlign='center';
    g.font='900 104px Fraunces, Georgia, serif'; g.fillStyle=ENCRE;
    g.fillText("Et ce n'est pas tout.", W/2, 640);
    const items=[['▶','Des vidéos, façon TikTok'],['✦','Des services : coiffure, informatique…'],['✓','Paiement à la livraison']];
    items.forEach((it,i)=>{
      const ap=lisse((u-.22-i*.16)/.2); if(ap<=0) return;
      g.globalAlpha=ap;
      const y=880+i*190 + (1-ap)*40;
      g.fillStyle=TERRA; g.beginPath(); g.arc(200,y-18,44,0,7); g.fill();
      g.fillStyle='#fff'; g.font='800 44px Inter, sans-serif'; g.fillText(it[0],200,y-2);
      // La ligne doit tenir jusqu'au bord: on reduit la police jusqu'a ce
      // qu'elle rentre, plutot que de la laisser se faire couper.
      let t=52; g.textAlign='left'; g.fillStyle=ENCRE;
      do { g.font='600 '+t+'px Inter, sans-serif'; t-=2; }
      while (g.measureText(it[1]).width > W-290-70 && t>28);
      g.fillText(it[1],290,y); g.textAlign='center';
    });
    g.globalAlpha=1; return;
  }
  if(p.type==='fin'){
    // La carte de collection, dans la mise en page de la maquette de Beau:
    // photo en haut, panneau creme en bas avec le bloc-marque.
    //
    // Sa photo ne m'est jamais parvenue en FICHIER — visible dans la
    // conversation, absente du disque, trois fois de suite. Plutot que de
    // rester bloque, on prend une VRAIE photo de maquillage vendue sur
    // Finjaro (Nnal Beauty, Yaounde): meme structure, meme effet, et rien
    // qui appartienne a une autre marque.
    const HP = Math.round(H*0.615);
    const im = cache.get('ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/66448e00-33ad-46e7-b7c0-2f385d10e239.jpg');
    g.fillStyle='#F3E4E9'; g.fillRect(0,0,W,HP);
    if(im){
      g.save(); g.beginPath(); g.rect(0,0,W,HP); g.clip();
      const r=Math.max(W/im.width, HP/im.height)*(1.03+.05*u);
      const w=im.width*r, h=im.height*r;
      g.drawImage(im,(W-w)/2,(HP-h)/2,w,h);
      g.restore();
    }
    const gr=g.createLinearGradient(0,HP,0,H);
    gr.addColorStop(0,'#F5EFE7'); gr.addColorStop(1,'#EFE6DA');
    g.fillStyle=gr; g.fillRect(0,HP,W,H-HP);

    const a2=lisse(u/.2), b2=lisse((u-.18)/.22), c2=lisse((u-.42)/.24);
    g.textAlign='center';
    g.globalAlpha=a2;
    g.font='900 128px Inter, sans-serif'; g.fillStyle='#1F3D36';
    g.fillText('F', W/2-26, HP+180);
    g.fillStyle='#D98E32'; g.beginPath(); g.arc(W/2+48, HP+82, 24, 0, 7); g.fill();
    g.globalAlpha=b2;
    (function(){ const mot='FINJARO', esp=22;
      g.font='600 96px Fraunces, Georgia, serif';
      let tw=0; for(const ch of mot) tw+=g.measureText(ch).width+esp; tw-=esp;
      let x=W/2-tw/2; g.textAlign='left'; g.fillStyle=ENCRE;
      for(const ch of mot){ g.fillText(ch,x,HP+300); x+=g.measureText(ch).width+esp; } })();
    (function(){ const mot='FINOU WINTER', esp=11;
      g.font='600 42px Inter, sans-serif';
      let tw=0; for(const ch of mot) tw+=g.measureText(ch).width+esp; tw-=esp;
      let x=W/2-tw/2; g.textAlign='left'; g.fillStyle=LAITON;
      for(const ch of mot){ g.fillText(ch,x,HP+372); x+=g.measureText(ch).width+esp; } })();
    g.textAlign='center';
    g.globalAlpha=c2;
    g.font='800 54px Inter, sans-serif'; g.fillStyle=ENCRE;
    g.fillText('DÉCOUVREZ LA COLLECTION', W/2, HP+490);
    g.fillText('MAQUILLAGE EXCLUSIVE', W/2, HP+560);
    g.fillStyle=TERRA;
    g.beginPath(); g.roundRect(W/2-290, HP+620, 580, 92, 46); g.fill();
    g.fillStyle='#fff'; g.font='800 40px Inter, sans-serif'; g.textBaseline='middle';
    g.fillText('exclusivement sur finjaro.net', W/2, HP+666); g.textBaseline='alphabetic';
    g.globalAlpha=1; return;
  }
  if(p.type==='titre'){
    // Une pancarte de section: grand, net, deux secondes, ca respire.
    fond();
    const a=lisse(u/.26);
    g.textAlign='center'; g.globalAlpha=a;
    g.fillStyle=TERRA; g.beginPath();
    g.roundRect(W/2-4, 700-(1-a)*40, 8, 96, 4); g.fill();
    g.font='900 132px Fraunces, Georgia, serif'; g.fillStyle=ENCRE;
    g.fillText(p.sur, W/2, 1000+(1-a)*30);
    g.font='600 48px Inter, sans-serif'; g.fillStyle=LAITON;
    g.fillText(p.sous, W/2, 1090+(1-a)*30);
    g.globalAlpha=1; return;
  }
  if(p.type==='reel'){
    const im=cache.get(p.it.i);
    if(im){ g.fillStyle='#0e0b09'; g.fillRect(0,0,W,H); couvre(im,p.mv,u); }
    else fond();
    // Habillage facon lecteur video: bandeau bas + bouton lecture.
    const gr=g.createLinearGradient(0,H,0,H*.5);
    gr.addColorStop(0,'rgba(14,11,9,.92)'); gr.addColorStop(1,'rgba(14,11,9,0)');
    g.fillStyle=gr; g.fillRect(0,H*.5,W,H*.5);
    const a=lisse(u/.22); g.globalAlpha=a;
    // gros bouton lecture, qui respire
    const pulse=1+.05*Math.sin(u*Math.PI*2);
    g.save(); g.translate(W/2,H/2); g.scale(pulse,pulse);
    g.fillStyle='rgba(255,255,255,.16)'; g.beginPath(); g.arc(0,0,96,0,7); g.fill();
    g.fillStyle='#fff'; g.beginPath();
    g.moveTo(-26,-40); g.lineTo(46,0); g.lineTo(-26,40); g.closePath(); g.fill();
    g.restore();
    // credit + titre
    g.font='800 30px Inter, sans-serif';
    const cred=(p.it.b+' · '+p.it.v).toUpperCase();
    const cw=g.measureText(cred).width+64;
    g.fillStyle='rgba(20,14,10,.55)'; g.beginPath(); g.roundRect(60,70,cw,74,37); g.fill();
    g.fillStyle='#fff'; g.textAlign='left'; g.textBaseline='middle';
    g.fillText(cred,92,109); g.textBaseline='alphabetic';
    g.font='600 68px Fraunces, Georgia, serif'; g.fillStyle='#fff';
    g.fillText(p.it.t,80,1660+(1-a)*40);
    g.globalAlpha=1; return;
  }
  if(p.type==='services'){
    fond();
    g.textAlign='center';
    const a=lisse(u/.16); g.globalAlpha=a;
    g.font='900 96px Fraunces, Georgia, serif'; g.fillStyle=ENCRE;
    g.fillText('On répare, on coiffe,', W/2, 480);
    g.fillText('on filme, on installe.', W/2, 590);
    SERVICES.forEach((sv,i)=>{
      const ap=lisse((u-.14-i*.085)/.16); if(ap<=0) return;
      g.globalAlpha=ap;
      const y=760+i*168+(1-ap)*36;
      g.fillStyle='#fff'; g.beginPath(); g.roundRect(70,y,W-140,138,26); g.fill();
      g.fillStyle='rgba(194,94,56,.12)'; g.beginPath(); g.roundRect(70,y,10,138,5); g.fill();
      g.textAlign='left';
      g.font='800 46px Inter, sans-serif'; g.fillStyle=ENCRE;
      let t=46; do{ g.font='800 '+t+'px Inter, sans-serif'; t-=2; }
      while(g.measureText(sv[0]).width>W-260 && t>26);
      g.fillText(sv[0],120,y+58);
      g.font='600 34px Inter, sans-serif'; g.fillStyle=TERRA;
      g.fillText(sv[1],120,y+106);
      g.font='400 30px Inter, sans-serif'; g.fillStyle=LAITON;
      g.textAlign='right'; g.fillText(sv[2],W-120,y+106); g.textAlign='left';
    });
    g.globalAlpha=1; return;
  }
  if(p.type==='finia'){
    fond();
    g.textAlign='center';
    const a=lisse(u/.16); g.globalAlpha=a;
    g.font='900 104px Fraunces, Georgia, serif'; g.fillStyle=ENCRE;
    g.fillText('Et Finia répond.', W/2, 520);
    g.font='600 44px Inter, sans-serif'; g.fillStyle=LAITON;
    g.fillText("L'assistante de Finjaro, 24 h sur 24.", W/2, 600);
    // Deux bulles de conversation: la question, puis la reponse.
    const q="Je cherche une robe pour un mariage";
    const b1=lisse((u-.16)/.16);
    if(b1>0){
      g.globalAlpha=b1; g.textAlign='left';
      g.font='600 42px Inter, sans-serif';
      const w=g.measureText(q).width+72;
      g.fillStyle=TEAL; g.beginPath(); g.roundRect(W-90-w,760+(1-b1)*30,w,104,32); g.fill();
      g.fillStyle='#fff'; g.textBaseline='middle';
      g.fillText(q,W-90-w+36,812+(1-b1)*30); g.textBaseline='alphabetic';
    }
    const b2=lisse((u-.36)/.18);
    if(b2>0){
      g.globalAlpha=b2; g.textAlign='left';
      const rep=["J'ai trouvé 3 robes dans ton budget,","chez TANA Shop à Douala. Je peux","te montrer, ou chercher plus court ?"];
      g.font='600 40px Inter, sans-serif';
      let mw=0; for(const l of rep) mw=Math.max(mw,g.measureText(l).width);
      const bw=mw+80, bh=76+rep.length*56;
      g.fillStyle='#fff'; g.beginPath(); g.roundRect(90,930+(1-b2)*30,bw,bh,32); g.fill();
      g.fillStyle=TERRA; g.font='800 30px Inter, sans-serif';
      g.fillText('FINIA',130,988+(1-b2)*30);
      g.fillStyle=ENCRE; g.font='600 40px Inter, sans-serif';
      rep.forEach((l,i)=>g.fillText(l,130,1052+i*56+(1-b2)*30));
    }
    const b3=lisse((u-.6)/.2);
    if(b3>0){
      g.globalAlpha=b3; g.textAlign='center';
      g.font='600 40px Inter, sans-serif'; g.fillStyle=LAITON;
      g.fillText('Elle cherche, elle compare, elle guide.', W/2, 1420+(1-b3)*24);
      g.fillText('Et elle publie tes articles pour toi.', W/2, 1480+(1-b3)*24);
    }
    g.globalAlpha=1; return;
  }
  if(p.type==='cta'){
    fond();
    g.textAlign='center';
    const a=lisse(u/.2), b=lisse((u-.24)/.22), c2=lisse((u-.5)/.22);
    g.globalAlpha=a;
    g.font='600 56px Inter, sans-serif'; g.fillStyle=LAITON;
    g.fillText('Toi aussi,', W/2, 720+(1-a)*30);
    g.globalAlpha=b;
    g.font='900 116px Fraunces, Georgia, serif'; g.fillStyle=ENCRE;
    g.fillText('crée ta boutique', W/2, 870+(1-b)*30);
    g.fillStyle=TERRA;
    g.fillText('en 2 minutes.', W/2, 1000+(1-b)*30);
    g.globalAlpha=c2;
    g.font='600 44px Inter, sans-serif'; g.fillStyle=LAITON;
    g.fillText("C'est gratuit. Tes photos, tes prix, ta boutique.", W/2, 1130+(1-c2)*24);
    g.fillStyle=TEAL; g.beginPath(); g.roundRect(W/2-290,1220,580,110,55); g.fill();
    g.fillStyle='#fff'; g.font='800 50px Inter, sans-serif'; g.textBaseline='middle';
    g.fillText('finjaro.net', W/2, 1276); g.textBaseline='alphabetic';
    g.globalAlpha=1; return;
  }
  if(p.type==='coupure'){ fond(); return; }
  if(p.type==='duo'){
    // Deux articles dans un seul plan: le montage respire et on montre
    // deux fois plus en autant de secondes.
    fond();
    const a=lisse(u/.2);
    const HH=Math.round(H/2);
    [p.a1,p.a2].forEach((it,idx)=>{
      const im=cache.get(it.i), y0=idx*HH;
      const ap=lisse((u-idx*.1)/.24);
      g.save(); g.beginPath(); g.rect(0,y0,W,HH); g.clip();
      if(im){
        const r=Math.max(W/im.width,HH/im.height)*(1.02+.06*u);
        const w=im.width*r,h=im.height*r;
        g.drawImage(im,(W-w)/2,y0+(HH-h)/2,w,h);
      } else { g.fillStyle=CREME2; g.fillRect(0,y0,W,HH); }
      const gr=g.createLinearGradient(0,y0+HH,0,y0+HH*.55);
      gr.addColorStop(0,'rgba(16,11,8,.9)'); gr.addColorStop(1,'rgba(16,11,8,0)');
      g.fillStyle=gr; g.fillRect(0,y0+HH*.55,W,HH*.45);
      g.restore();
      g.globalAlpha=ap; g.textAlign='left';
      g.font='800 26px Inter, sans-serif'; g.fillStyle='#F3D9C6';
      g.fillText((it.b+' · '+it.v).toUpperCase(),70,y0+HH-150);
      let t=52; do{ g.font='600 '+t+'px Fraunces, Georgia, serif'; t-=2; }
      while(g.measureText(it.a).width>W-140 && t>28);
      g.fillStyle='#fff'; g.fillText(it.a,70,y0+HH-92);
      g.font='800 34px Inter, sans-serif'; g.fillStyle=it.dem?'#E8C9A8':'#FFB48F';
      g.fillText(it.prix,70,y0+HH-44);
      g.globalAlpha=1;
    });
    // filet de separation, discret
    g.fillStyle='rgba(250,246,240,.9)'; g.fillRect(0,HH-3,W,6);
    return;
  }
  // --- plan photo ---
  const im=cache.get(p.it.i);
  if(im){ g.fillStyle='#1a1512'; g.fillRect(0,0,W,H); couvre(im,p.mv,u); }
  else fond();
  const gr=g.createLinearGradient(0,H,0,H*.48);
  gr.addColorStop(0,'rgba(20,14,10,.92)'); gr.addColorStop(.45,'rgba(20,14,10,.4)');
  gr.addColorStop(1,'rgba(20,14,10,0)');
  g.fillStyle=gr; g.fillRect(0,H*.48,W,H*.52);
  // pastille boutique en haut a gauche — le credit se lit tout le long.
  g.globalAlpha=Math.min(1,e*1.4);
  g.font='800 30px Inter, sans-serif';
  const cred=(p.it.b+' · '+p.it.v).toUpperCase();
  const cw=g.measureText(cred).width+64;
  g.fillStyle='rgba(20,14,10,.55)'; g.beginPath(); g.roundRect(60,70,cw,74,37); g.fill();
  g.fillStyle='#fff'; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(cred,92,109); g.textBaseline='alphabetic';
  // legende basse
  const dy=(1-e)*46;
  if(p.it.a){
    const ls=lignes(p.it.a,'600 72px Fraunces, Georgia, serif',W-160).slice(0,2);
    g.fillStyle='#fff'; g.font='600 72px Fraunces, Georgia, serif';
    ls.forEach((l,i)=>g.fillText(l,80,1620+i*82+dy));
    const pr=p.it.prix;
    g.font=(p.it.dem?'800 38px':'800 48px')+' Inter, sans-serif';
    const w=g.measureText(pr).width+72, yb=1620+ls.length*82+18+dy;
    g.fillStyle=p.it.dem?LAITON:TERRA; g.beginPath(); g.roundRect(80,yb,w,76,15); g.fill();
    g.fillStyle='#fff'; g.textBaseline='middle'; g.fillText(pr,116,yb+39); g.textBaseline='alphabetic';
  }
  g.globalAlpha=1;
}

// ---------- chargement ----------
const etat=document.getElementById('etat');
(async()=>{
  const chemins=[...new Set([...SEQ.flatMap(c=>[...c.items,...(c.duo||[])].map(i=>i.i)), ...REELS.map(r=>r.i),
    'ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/66448e00-33ad-46e7-b7c0-2f385d10e239.jpg'])];
  let n=0;
  await Promise.all(chemins.map(c=>new Promise(res=>{
    const im=new Image(); im.crossOrigin='anonymous';
    im.onload=()=>{cache.set(c,im);n++;res();};
    im.onerror=()=>{n++;res();};
    im.src=BASE+c;
  })));
  try{ await document.fonts.ready; }catch{}
  dessine(plans[0],1);
  etat.textContent=`${n}/${chemins.length} photos — ${TOTAL.toFixed(1)} s`;
  document.getElementById('go').disabled=false;
})();
</script>
