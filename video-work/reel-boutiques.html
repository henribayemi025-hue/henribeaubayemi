<style>

<script>
// Finjaro — la bande-annonce des boutiques, fabriquee EN FICHIER VIDEO.
//
// Beau: « pourquoi c'est en html ? je veux la vidéo ».
//
// Il a raison. La premiere version demandait un enregistrement d'ecran, ce
// qui est un travail de plus pour quelqu'un qui en a deja trop. Cette

//
// AUCUN CHIFFRE INVENTE: boutiques, articles et prix viennent de la base.
// Aucune photo prise sur le web. Les boutiques dont le catalogue repose sur
// les images de demonstration livrees avec l'application sont ecartees.
const BASE = 'https://bokwivwizghdlaedczbw.supabase.co/storage/v1/object/public/products/';
const DATA = [{"b": "TANA Shop 🛍️👗", "v": "Douala", "pays": "CM", "logo": "ec5f1982-015e-4c22-9748-e2c4709a32ad/1b9d9b52-a78a-4892-a719-d9b7b18231f6.jpg", "rayon": "Robes", "items": [{"a": "Robe noire dentelle", "i": "ec5f1982-015e-4c22-9748-e2c4709a32ad/b7cb91fb-10aa-4d8f-8873-90ba8667a488.jpg", "f": 2500}, {"a": "Robe rose fleurie", "i": "ec5f1982-015e-4c22-9748-e2c4709a32ad/3b244ffc-10c7-4518-8143-3f48e460bcb3.jpg", "f": 1500}, {"a": "Mini robe bleu", "i": "ec5f1982-015e-4c22-9748-e2c4709a32ad/997e0288-15bb-4eb8-9cfb-d21f19ac02db.jpg", "f": 1500}, {"a": "Robe longue manche", "i": "ec5f1982-015e-4c22-9748-e2c4709a32ad/0d61cd53-32af-42bc-8f95-a41ebdea63cc.jpg", "f": 2500}, {"a": "Robe courte bleu", "i": "ec5f1982-015e-4c22-9748-e2c4709a32ad/faded4bb-c144-4eb7-b56d-415733cd000c.jpg", "f": 2000}, {"a": "Mini robe avec poche", "i": "ec5f1982-015e-4c22-9748-e2c4709a32ad/1f6cdb89-3061-4804-8b0c-114a9b1701d4.jpg", "f": 1500}]}, {"b": "Nnal Beauty", "v": "Yaoundé", "pays": "CM", "logo": "ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/4f3df060-1c6d-499f-8c1f-1e282da11686.jpg", "rayon": "Beauté & Cosmétiques", "items": [{"a": "Fond de teint liquide Avour", "i": "ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/d3fce225-df53-47bf-9cf7-0d7ed38aabda.jpg", "f": 8999}, {"a": "Kit de pinceaux", "i": "ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/66448e00-33ad-46e7-b7c0-2f385d10e239.jpg", "f": 7500}, {"a": "Fond de teint Vee beauty", "i": "ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/ed9bbf02-2c15-4586-9381-bcf1d8cf438d.jpg", "f": 8999}, {"a": "Zikel : fond de teint compact", "i": "ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/f10f208d-84a7-4714-8395-e6a1610ce14d.jpg", "f": 7000}, {"a": "Fix makeup : fixateur hydratant", "i": "ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/9fa43c2a-adc0-4e14-a1e7-83a712bc1299.jpg", "f": 3000}, {"a": "Zikel : fond de teint compact", "i": "ffd110b4-6a6b-4eef-bdd6-fa8d1ea4886e/62fb13fa-d192-414c-bd9f-135c9c4b23cf.jpg", "f": 4000}]}, {"b": "MTGBA MARKET PLACE", "v": "Yaoundé", "pays": "CM", "logo": "49d28698-1f14-4b4e-9276-62d1ca26c03e/850e5857-118c-4eb3-85de-eeb238acbc75.webp", "rayon": "Chaussures homme", "items": [{"a": "Mocassins Homme BOSS Noir Brillant", "i": "49d28698-1f14-4b4e-9276-62d1ca26c03e/64259614-180a-42a6-b129-c266925c9117.webp", "d": true}, {"a": "Chaussures Chukka en Daim", "i": "49d28698-1f14-4b4e-9276-62d1ca26c03e/9fab68ed-87eb-4866-9767-03f2a8d34917.webp", "d": true}, {"a": "Chaussures en daim bleu marine", "i": "49d28698-1f14-4b4e-9276-62d1ca26c03e/e36463bc-d523-46f9-bbf9-4fc32470f311.webp", "d": true}, {"a": "Mocassins noirs vernis", "i": "49d28698-1f14-4b4e-9276-62d1ca26c03e/68e21072-1f5e-4809-912c-857fac348c68.webp", "d": true}, {"a": "Baskets à carreaux", "i": "49d28698-1f14-4b4e-9276-62d1ca26c03e/4f114d56-5d1f-45f7-8b85-6225ecc81750.webp", "d": true}, {"a": "Chaussures en daim noir", "i": "49d28698-1f14-4b4e-9276-62d1ca26c03e/2fe24892-4acb-44a4-a954-eee228324d5d.webp", "d": true}]}, {"b": "SM Store & Beauty", "v": "Yaoundé", "pays": "CM", "logo": "720c4d78-c78d-49cd-9318-6daf72e7f865/298a6868-d544-439f-9ca6-cfa04ac5e2d8.jpg", "rayon": "Mode Femme", "items": [{"a": "Robe maya", "i": "720c4d78-c78d-49cd-9318-6daf72e7f865/9251938c-a962-437c-ab1a-e55a8333da53.jpg", "f": 7000}, {"a": "Robe", "i": "720c4d78-c78d-49cd-9318-6daf72e7f865/f64c4c0e-4a24-4515-b2f4-3ea2668f0ace.jpg", "f": 7000}, {"a": "Ensemble", "i": "720c4d78-c78d-49cd-9318-6daf72e7f865/2d3ab17e-e985-4c76-a100-8bb23de871fe.jpg", "f": 9500}, {"a": "Ensemble", "i": "720c4d78-c78d-49cd-9318-6daf72e7f865/a8ea4dd4-9335-445f-9652-59ddd05e797c.jpg", "f": 9500}, {"a": "Robe", "i": "720c4d78-c78d-49cd-9318-6daf72e7f865/9ac45e4b-0396-422e-a50d-03dae3cbb868.jpg", "f": 7000}]}, {"b": "ByFlora kids 🥰", "v": "Douala", "pays": "CM", "logo": "dbd3f4a3-6a6a-496e-862b-fee7e22946e4/4d70775d-6a3a-4a45-89a5-3c2dc196c21a.jpg", "rayon": "Enfants & Bébé", "sansNom": true, "items": [{"i": "dbd3f4a3-6a6a-496e-862b-fee7e22946e4/2b8b843b-af68-4ddb-a24b-4e9c53c8fd13.jpg"}, {"i": "dbd3f4a3-6a6a-496e-862b-fee7e22946e4/0bcdb23e-8bcc-45ad-a79b-15f37c637073.jpg"}, {"i": "dbd3f4a3-6a6a-496e-862b-fee7e22946e4/9890876f-05e2-4750-b071-04f9f232750a.jpg"}, {"i": "dbd3f4a3-6a6a-496e-862b-fee7e22946e4/eed4f92c-08dc-42ba-aa3e-4bf67583d3da.jpg"}, {"i": "dbd3f4a3-6a6a-496e-862b-fee7e22946e4/9fb0bc04-1595-4343-8b6d-c0084fe8f6a0.jpg"}, {"i": "dbd3f4a3-6a6a-496e-862b-fee7e22946e4/40181c82-544b-466c-b18b-d43fb2fece86.jpg"}]}, {"b": "Didi_beauty56", "v": "Nanterre", "pays": "FR", "logo": "86d2bee7-e378-4efd-84d7-6a9c39c66ca8/fbdf1913-317b-479a-b68e-7aa10717ee86.jpg", "rayon": "Ongles & Manucure", "items": [{"a": "French blanche", "i": "86d2bee7-e378-4efd-84d7-6a9c39c66ca8/b769ef9a-7b74-4ea5-8981-5a75dd378ca9.jpg", "f": 19685}, {"a": "French Bordeaux", "i": "86d2bee7-e378-4efd-84d7-6a9c39c66ca8/26f4871a-70f9-4577-bf05-d83a85328bd5.jpg", "d": true}]}, {"b": "Maison NGC", "v": "Yaoundé", "pays": "CM", "logo": "373f6a65-d417-4a84-b899-bd16b52de908/8ba75b73-8dc7-4f69-8d33-59f5a751bb41.jpg", "rayon": "Mode Femme", "items": [{"a": "Boubou", "i": "373f6a65-d417-4a84-b899-bd16b52de908/b3edac74-471e-4822-9415-cbb6bacc9399.jpg", "d": true}, {"a": "Robe", "i": "373f6a65-d417-4a84-b899-bd16b52de908/4f3e5aef-a5d2-4b05-8921-9c26c4e33bee.jpg", "f": 2500}, {"a": "Robe", "i": "373f6a65-d417-4a84-b899-bd16b52de908/67c69d0e-d90f-471b-9d3e-655123d48475.jpg", "f": 2500}]}, {"b": "YAKA BAOBAB", "v": "Yaoundé", "pays": "CM", "logo": "7be8b524-9c39-4fe2-b804-b71eadf92b88/e7a2bb7a-e76c-4ffe-92ca-861ab347ab6c.jpg", "rayon": "Jus Naturels", "items": [{"a": "YAKA Baobab", "i": "7be8b524-9c39-4fe2-b804-b71eadf92b88/11787056-5931-4fbd-a303-f6dcaeabca5e.jpg", "f": 1000}, {"a": "YAKA Baobab", "i": "7be8b524-9c39-4fe2-b804-b71eadf92b88/44e2f5ad-b8bd-45c8-8aee-446f7f22bcc8.jpg", "f": 1000}]}, {"b": "Lmp sarl", "v": "Douala Akwa", "pays": "CM", "logo": "6c856c40-152f-457a-83cd-a125aa47f3f6/090af901-2703-40cb-aecb-1e5f5aa9f4af.jpg", "rayon": "Équipement pro & Sécurité", "items": [{"a": "Botte red wing", "i": "6c856c40-152f-457a-83cd-a125aa47f3f6/5804fa0f-ec56-4a23-802b-d6234fad8f61.jpg", "f": 150000}, {"a": "Chaussure de sécurité", "i": "6c856c40-152f-457a-83cd-a125aa47f3f6/c1cd52ae-46f9-4f2f-8a56-f6cede8220d1.jpg", "f": 25000}, {"a": "T-shirt de sécurité", "i": "6c856c40-152f-457a-83cd-a125aa47f3f6/c3ff6870-1bb3-4610-88b0-ed5047fc1d80.jpg", "f": 10000}, {"a": "Gilet de signalisation", "i": "6c856c40-152f-457a-83cd-a125aa47f3f6/bb196a58-1c81-4b6c-9967-a095051bab49.jpg", "f": 5000}, {"a": "Casque anti bruit", "i": "6c856c40-152f-457a-83cd-a125aa47f3f6/c94da28d-5022-46d7-bb32-bcf57fd72734.jpg", "f": 4000}, {"a": "Gant nitrile", "i": "6c856c40-152f-457a-83cd-a125aa47f3f6/e156fee8-495f-4521-8c6e-6a322ada3527.jpg", "f": 5000}]}];

const T_INTRO = 4.6, T_CARTE = 2.4, T_PHOTO = 1.9, T_OUTRO = 5.4, FPS = 30;
const W = 1080, H = 1920;
const CREME = '#FAF6F0', CREME2 = '#F1E8DC', ENCRE = '#241C17',
      TERRA = '#C25E38', LAITON = '#8C6A3D', TEAL = '#2F6D62';

// La monnaie de la BOUTIQUE, jamais une devise par defaut: une boutique a
// Nanterre affiche des euros, une boutique a Douala des FCFA. C'est elle qui
// a saisi ses prix; les relire dans une autre monnaie n'a aucun sens.
const TAUX = { FR: 655.957, BE: 655.957, DE: 655.957 };
function prixTexte(it, pays) {
  if (it.d || it.f == null) return { t: 'Prix sur demande', demande: true };
  if (TAUX[pays]) return { t: (it.f / TAUX[pays]).toLocaleString('fr-FR',
    { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }) };
  return { t: it.f.toLocaleString('fr-FR') + ' FCFA' };
}

// ---------- Construction du plan de montage ----------
const plans = [];
plans.push({ type: 'intro', d: T_INTRO });
let k = 0;
for (const s of DATA) {
  plans.push({ type: 'carte', d: T_CARTE, s });
  for (const it of s.items) plans.push({ type: 'photo', d: T_PHOTO, s, it, alt: k++ % 2 === 1 });
}
plans.push({ type: 'outro', d: T_OUTRO });
const TOTAL = plans.reduce((t, p) => t + p.d, 0);

// ---------- Chargement des images ----------
const cache = new Map();
let salis = false;   // vrai si une photo a du etre chargee sans CORS

// Le canvas ne peut etre enregistre que s'il ne contient QUE des images
// servies avec l'en-tete CORS. Supabase le fait pour un bucket public, mais
// si un jour ce n'etait plus le cas, l'enregistrement echouerait au dernier
// moment avec une erreur de securite, apres deux minutes d'attente. On le
// detecte donc AU CHARGEMENT: on tente d'abord avec CORS, et si ca echoue on
// recharge sans — l'apercu reste visible, et le bouton dit la verite.
function charge(chemin) {
  return new Promise((res) => {
    const avecCors = new Image();
    avecCors.crossOrigin = 'anonymous';
    avecCors.onload = () => { cache.set(chemin, avecCors); res(true); };
    avecCors.onerror = () => {
      const sans = new Image();
      sans.onload = () => { cache.set(chemin, sans); salis = true; res(true); };
      sans.onerror = () => { cache.set(chemin, null); res(false); };
      sans.src = BASE + chemin;
    };
    avecCors.src = BASE + chemin;
  });
}
const aCharger = [];
for (const s of DATA) { aCharger.push(s.logo); for (const it of s.items) aCharger.push(it.i); }

// ---------- Dessin ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
const etat = document.getElementById('etat');
const jauge = document.querySelector('#jauge i');

function fond() {
  const grad = g.createLinearGradient(0, 0, W * .4, H);
  grad.addColorStop(0, CREME); grad.addColorStop(1, CREME2);
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
}
// Remplir le cadre sans deformer, avec un zoom lent: une image figee deux
// secondes fait « diaporama », un mouvement continu fait « video ».
function couvre(im, zoom) {
  const r = Math.max(W / im.width, H / im.height) * zoom;
  const w = im.width * r, h = im.height * r;
  g.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
}
function lignes(txt, police, maxL) {
  g.font = police;
  const out = []; let cur = '';
  for (const mot of String(txt).split(' ')) {
    const essai = cur ? cur + ' ' + mot : mot;
    if (g.measureText(essai).width > maxL && cur) { out.push(cur); cur = mot; } else cur = essai;
  }
  if (cur) out.push(cur);
  return out;
}
function texteCentre(txt, police, couleur, y, maxL, interligne) {
  const ls = lignes(txt, police, maxL);
  g.fillStyle = couleur; g.textAlign = 'center';
  ls.forEach((l, i) => g.fillText(l, W / 2, y + i * interligne));
  return ls.length * interligne;
}
function pastille(txt, police, fond2, couleur, cx, cy, padX, padY, r) {
  g.font = police;
  const w = g.measureText(txt).width + padX * 2, h = padY * 2 + 40;
  const x = cx - w / 2, y = cy - h / 2;
  g.fillStyle = fond2; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill();
  g.fillStyle = couleur; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(txt, cx, cy + 1); g.textBaseline = 'alphabetic';
}

function dessine(p, u) {                 // u = avancement du plan, 0 -> 1
  const e = Math.min(1, u / .22);        // apparition
  if (p.type === 'intro' || p.type === 'outro') {
    fond();
    g.globalAlpha = e;
    if (p.type === 'intro') {
      g.textAlign = 'center';
      g.font = '900 186px Fraunces, Georgia, serif';
      const large = g.measureText('Finjaro').width;
      g.fillStyle = ENCRE; g.textAlign = 'left';
      g.fillText('Fin', (W - large) / 2, 900);
      const w1 = g.measureText('Fin').width;
      g.fillStyle = TERRA; g.fillText('jaro', (W - large) / 2 + w1, 900);
      texteCentre('Des boutiques, des vraies.', '600 44px Inter, sans-serif', LAITON, 990, 900, 58);
      texteCentre('Et elles sont déjà en ligne.', '600 44px Inter, sans-serif', LAITON, 1048, 900, 58);
      g.fillStyle = TERRA; g.beginPath(); g.roundRect(W / 2 - 90, 1120, 180, 8, 8); g.fill();
    } else {
      texteCentre("Ta boutique t'attend.", '900 128px Fraunces, Georgia, serif', ENCRE, 860, 880, 140);
      texteCentre('finjaro.net', '800 58px Inter, sans-serif', TEAL, 1130, 900, 70);
      texteCentre("Ouvre la tienne en 5 minutes — c'est gratuit.",
        '600 38px Inter, sans-serif', LAITON, 1210, 860, 50);
    }
    g.globalAlpha = 1; return;
  }

  if (p.type === 'carte') {
    fond(); g.globalAlpha = e;
    const logo = cache.get(p.s.logo);
    const cx = W / 2, cy = 700, r = 145;
    g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.closePath();
    g.fillStyle = '#fff'; g.fill(); g.clip();
    if (logo) {
      const s2 = Math.max((r * 2) / logo.width, (r * 2) / logo.height);
      g.drawImage(logo, cx - logo.width * s2 / 2, cy - logo.height * s2 / 2,
        logo.width * s2, logo.height * s2);
    }
    g.restore();
    g.lineWidth = 10; g.strokeStyle = '#fff'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
    let y = 960;
    y += texteCentre(p.s.b, '900 92px Fraunces, Georgia, serif', ENCRE, y, 900, 100);
    g.font = '600 40px Inter, sans-serif'; g.fillStyle = LAITON; g.textAlign = 'center';
    g.fillText(p.s.v.toUpperCase(), W / 2, y + 30);
    pastille(p.s.rayon, '700 36px Inter, sans-serif', TERRA, '#fff', W / 2, y + 140, 40, 18, 999);
    g.globalAlpha = 1; return;
  }

  // --- Plan article ---
  const im = cache.get(p.it.i);
  const zoom = p.alt ? 1.14 - .14 * u : 1 + .14 * u;
  if (im) { g.fillStyle = '#1a1512'; g.fillRect(0, 0, W, H); couvre(im, zoom); }
  else {
    // Une photo manquante ne doit pas produire un trou noir dans la video.
    fond();
    texteCentre(p.it.a || p.s.b, '600 64px Fraunces, Georgia, serif', LAITON, H / 2, 820, 80);
  }
  const grad = g.createLinearGradient(0, H, 0, H * .45);
  grad.addColorStop(0, 'rgba(20,14,10,.92)');
  grad.addColorStop(.42, 'rgba(20,14,10,.42)');
  grad.addColorStop(1, 'rgba(20,14,10,0)');
  g.fillStyle = grad; g.fillRect(0, H * .45, W, H * .55);

  const dy = (1 - e) * 46;
  g.globalAlpha = e;
  g.textAlign = 'left';
  g.font = '800 34px Inter, sans-serif'; g.fillStyle = '#F3D9C6';
  g.fillText((p.s.b + ' · ' + p.s.v).toUpperCase(), 80, 1560 + dy);
  if (!p.s.sansNom && p.it.a) {
    const ls = lignes(p.it.a, '600 74px Fraunces, Georgia, serif', W - 160).slice(0, 2);
    g.fillStyle = '#fff';
    ls.forEach((l, i) => g.fillText(l, 80, 1650 + i * 84 + dy));
    if (!p.s.sansNom) {
      const pr = prixTexte(p.it, p.s.pays);
      g.font = (pr.demande ? '800 40px' : '800 50px') + ' Inter, sans-serif';
      const w = g.measureText(pr.t).width + 72;
      const yb = 1650 + ls.length * 84 + 20 + dy;
      g.fillStyle = pr.demande ? LAITON : TERRA;
      g.beginPath(); g.roundRect(80, yb, w, 78, 16); g.fill();
      g.fillStyle = '#fff'; g.textBaseline = 'middle';
      g.fillText(pr.t, 116, yb + 40); g.textBaseline = 'alphabetic';
    }
  }
  g.globalAlpha = 1;
}

// ---------- Lecture + enregistrement ----------
const bornes = []; let acc = 0;
for (const p of plans) { bornes.push([acc, acc + p.d, p]); acc += p.d; }

function planA(t) {
  for (const [a, b, p] of bornes) if (t >= a && t < b) return [p, (t - a) / p.d];
  return [plans[plans.length - 1], 1];
}

function typeSortie() {
  // MP4 quand le navigateur sait le faire (Chrome recent), sinon WebM. Les
  // deux s'importent dans CapCut.
  for (const t of ['video/mp4;codecs=avc1.42E01E', 'video/mp4',
                   'video/webm;codecs=vp9', 'video/webm']) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

async function fabrique() {
  const bouton = document.getElementById('go');
  bouton.disabled = true;
  const mime = typeSortie();
  if (!mime) { etat.textContent = "Ce navigateur ne sait pas enregistrer. Ouvre la page dans Google Chrome."; bouton.disabled = false; return; }
  if (salis) {
    etat.textContent = "Les photos ne sont pas servies avec l'autorisation nécessaire à l'enregistrement. "
      + "L'aperçu marche, mais le fichier ne peut pas être fabriqué ici : enregistre l'écran pendant la lecture, et préviens-moi.";
    bouton.disabled = false; return;
  }

  const flux = cv.captureStream(FPS);
  const rec = new MediaRecorder(flux, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  const morceaux = [];
  rec.ondataavailable = (ev) => ev.data.size && morceaux.push(ev.data);

  const fini = new Promise((res) => { rec.onstop = res; });
  rec.start(1000);
  const t0 = performance.now();

  await new Promise((res) => {
    (function tic() {
      const t = (performance.now() - t0) / 1000;
      const [p, u] = planA(Math.min(t, TOTAL - .001));
      dessine(p, u);
      jauge.style.width = Math.min(100, (t / TOTAL) * 100) + '%';
      etat.textContent = `Enregistrement… ${t.toFixed(0)} s sur ${TOTAL.toFixed(0)} s — laisse cet onglet devant, ne le réduis pas.`;
      if (t >= TOTAL) return res();
      requestAnimationFrame(tic);
    })();
  });

  rec.stop();
  await fini;
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const blob = new Blob(morceaux, { type: mime });
  const a = document.getElementById('dl');
  a.href = URL.createObjectURL(blob);
  a.download = 'finjaro-boutiques.' + ext;
  a.classList.add('on');
  a.textContent = `⬇ Télécharger la vidéo (${ext.toUpperCase()}, ${(blob.size / 1048576).toFixed(1)} Mo)`;
  etat.textContent = `C'est fait : ${TOTAL.toFixed(0)} s. Le fichier est prêt.`;
  bouton.disabled = false;
  bouton.textContent = '↻ Refaire';
}

(async () => {
  let n = 0, ok = 0;
  for (const c of aCharger) {
    ok += (await charge(c)) ? 1 : 0;
    n++;
    etat.textContent = `Chargement des photos… ${n}/${aCharger.length}`;
    jauge.style.width = (n / aCharger.length) * 100 + '%';
  }
  try { await document.fonts.ready; } catch { /* police de repli */ }
  dessine(plans[0], 1);
  jauge.style.width = '0%';
  document.getElementById('go').onclick = fabrique;
  document.getElementById('go').disabled = false;
  const dur = `${Math.floor(TOTAL / 60)} min ${String(Math.round(TOTAL % 60)).padStart(2, '0')}`;
  const base = ok === aCharger.length
    ? `${ok} photos chargées. Durée : ${dur}.`
    : `${ok} photos sur ${aCharger.length} ont pu être chargées. Durée : ${dur}.`;
  etat.textContent = salis
    ? base + " Attention : l'enregistrement direct ne sera pas possible (photos sans autorisation CORS)."
    : base + " Appuie sur le bouton et laisse l'onglet devant, sans le réduire.";
})();
</script>
