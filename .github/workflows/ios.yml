# Fabrique l'app iOS signée et l'ENVOIE directement à App Store Connect.
#
# Lancement à la main (onglet Actions → « iOS IPA » → Run workflow), ou
# automatiquement quand on modifie l'app native. Contrairement à Android, pas
# de fichier à télécharger puis déposer: l'envoi vers Apple fait partie du
# job, parce que l'outil de dépôt d'Apple (Transporter) n'existe pas sous
# Windows — Beau ne pourrait pas déposer le fichier lui-même.
#
# Signature: AUCUN certificat à fabriquer ni à garder à la main. fastlane
# demande à Apple, à partir de la clé d'API, un certificat de distribution et
# un profil App Store, les installe, puis archive en les désignant.
# La signature « automatique » de Xcode a été essayée d'abord et ne peut pas
# marcher ici: elle ne signe qu'en développement, et un profil de
# développement exige au moins un iPhone enregistré dans le compte — ce
# qu'une machine de CI n'a pas. Voir fastlane/Fastfile pour le détail.
#
# Secrets requis (Settings → Secrets → Actions):
#   APPSTORE_API_KEY_ID      — l'identifiant de la clé (10 caractères)
#   APPSTORE_API_ISSUER_ID   — l'Issuer ID du compte (formé comme un UUID)
#   APPSTORE_API_KEY_BASE64  — le fichier AuthKey_XXXXXXXXXX.p8 encodé en base64
# La clé se crée sur App Store Connect → Utilisateurs et accès → Intégrations
# → Clés API (rôle Admin ou App Manager). Comme la clé Sign in with Apple,
# le .p8 ne se télécharge qu'UNE fois.
#
# Prérequis côté App Store Connect: la fiche de l'app doit exister (Mes apps
# → + → Nouvelle app, bundle net.finjaro.app), sinon l'envoi échoue avec
# « No suitable application records were found ».
name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'ios/**'
      - 'capacitor.config.json'
      # Le Fastfile EST la recette du build: l'oublier ici, c'est pousser un
      # correctif de signature qui ne declenche aucun run (arrive au run 6).
      - 'fastlane/**'
      - '.github/workflows/ios.yml'

jobs:
  ipa:
    # Les minutes macOS comptent 10x dans le quota GitHub: ce job ne tourne
    # que quand l'app NATIVE change, ce qui est rare — le contenu vient de
    # finjaro.net et se met à jour sans reconstruire l'app.
    #
    # macos-26 et non macos-15: Apple REFUSE désormais tout envoi compilé avec
    # un SDK antérieur à iOS 26 (« This app was built with the iOS 18.5 SDK »,
    # erreur 409 au run 8 — l'app était pourtant construite et signée
    # correctement). L'image macos-15 ne fournit que Xcode 16.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets App Store Connect
        id: secrets
        env:
          KID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISS: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          if [ -z "$KID" ] || [ -z "$ISS" ] || [ -z "$P8" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Secrets App Store Connect manquants (APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_BASE64)."
              exit 1
            fi
            echo "::warning::Clé App Store Connect absente — build iOS sauté."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sélectionner le Xcode le plus récent
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # On prend le plus récent installé plutôt que d'écrire un numéro en
          # dur: les images GitHub changent de version d'Xcode régulièrement,
          # et Apple relève son exigence de SDK chaque année.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
          echo "SDK iOS: $(xcodebuild -showsdks | grep -i iphoneos | tail -1)"

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          # Même exigence que la chaîne Android: la CLI Capacitor veut Node 22.
          node-version: '22'
          cache: npm

      - name: Construire le web + synchroniser Capacitor
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Poser la clé d'API
        if: steps.secrets.outputs.ready == 'true'
        env:
          KID: ${{ secrets.APPSTORE_API_KEY_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          # Même précaution que pour le keystore Android: un copier-coller de
          # secret embarque facilement un retour à la ligne invisible.
          mkdir -p "$HOME/private_keys"
          printf '%s' "$P8" | tr -d ' \r\n' | base64 -d > "$HOME/private_keys/AuthKey_${KID}.p8"

      - name: Fabriquer et envoyer
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Le trousseau temporaire que crée `setup_ci` a besoin d'un mot de
          # passe; sans lui fastlane en invente un et le certificat devient
          # illisible à l'étape suivante.
          MATCH_KEYCHAIN_PASSWORD: ci-tmp
        run: |
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          # fastlane est préinstallé sur les machines macOS de GitHub; on ne
          # l'installe que s'il venait à disparaître d'une image future.
          fastlane --version >/dev/null 2>&1 || sudo gem install fastlane -NV
          fastlane ios release
          echo "Build 1.0.${BUILD_NUMBER} envoyé — visible dans App Store Connect → TestFlight d'ici quelques minutes."
